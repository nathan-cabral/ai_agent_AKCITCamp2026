<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Guardiã — protótipo navegável (Sala Lilás · Goiás)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --lilac:#4B2E83; --lilac-2:#5B3B96; --lilac-soft:#EFEAFB; --lilac-veil:#F8F5FE;
  --ink:#191430; --ink-2:#46405F; --muted:#7B7496;
  --ok-bg:#E8F5EC; --ok-ink:#1C7A49; --warn-bg:#FBF0E1; --warn-ink:#95590A;
  --danger:#B3261E; --danger-bg:#FBEAE8;
  --line:#E7E2F2; --card:#fff; --bg:#F4F2F8;
  --shadow:0 2px 8px rgba(25,20,48,.05), 0 18px 40px -22px rgba(25,20,48,.35);
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--lilac-2)}
:focus-visible{outline:2px solid var(--lilac-2); outline-offset:2px; border-radius:8px}

/* ---------- topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:40; background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:1460px; margin:0 auto; padding:12px 24px;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:11px; font-weight:700; letter-spacing:-.01em}
.brand svg{width:30px;height:30px}
.brand small{display:block; font-weight:500; font-size:11.5px; color:var(--muted); letter-spacing:.02em}
.topbar-sp{flex:1}
.tag{
  display:inline-flex; align-items:center; gap:7px; background:var(--lilac-soft);
  color:var(--lilac); font-size:12.5px; font-weight:600; padding:5px 11px; border-radius:999px;
}
.tag.dot::before{content:""; width:7px;height:7px;border-radius:50%;background:var(--lilac-2)}
.btn-ghost{
  border:1px solid var(--line); background:#fff; border-radius:11px; padding:8px 13px;
  font-size:13.5px; font-weight:600; color:var(--ink-2); transition:.18s;
}
.btn-ghost:hover{border-color:var(--lilac); color:var(--lilac); transform:translateY(-1px)}
.btn-ghost.solid{background:var(--lilac); border-color:var(--lilac); color:#fff}
.btn-ghost.solid:hover{background:var(--lilac-2); color:#fff}

/* ---------- shell ---------- */
.shell{
  max-width:1460px; margin:0 auto; padding:22px 24px 56px;
  display:grid; grid-template-columns:268px minmax(0,1fr) 372px; gap:22px; align-items:start;
}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:0 2px 8px rgba(25,20,48,.04)}
.rail, .inspector{position:sticky; top:78px}
.pad{padding:18px}
.rail h3, .inspector h3{font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin:0 0 12px; font-weight:700}
.navlist{display:flex; flex-direction:column; gap:4px}
.navbtn{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left; padding:9px 11px;
  border-radius:11px; border:1px solid transparent; transition:.16s; color:var(--ink-2); font-size:14px;
}
.navbtn:hover{background:var(--lilac-veil); color:var(--lilac)}
.navbtn.on{background:var(--lilac); color:#fff; box-shadow:0 6px 16px -8px rgba(75,46,131,.75)}
.navbtn .num{
  font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; width:26px; height:22px;
  display:inline-flex; align-items:center; justify-content:center; border-radius:7px;
  background:var(--lilac-soft); color:var(--lilac); flex:none;
}
.navbtn.on .num{background:rgba(255,255,255,.2); color:#fff}
.navbtn small{display:block; font-size:11.5px; color:var(--muted); font-weight:500}
.navbtn.on small{color:rgba(255,255,255,.72)}
.rail hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.rail label.fld{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px}
select,input[type=text]{
  width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:11px; background:#fff;
  font-family:inherit; font-size:14px; color:var(--ink);
}
select:focus,input[type=text]:focus{outline:2px solid var(--lilac-2); outline-offset:1px; border-color:var(--lilac-2)}
.hint{font-size:12px;color:var(--muted);line-height:1.5}

/* ---------- stage / phone ---------- */
.stage{display:flex; flex-direction:column; align-items:center; gap:14px}
.phone{
  width:392px; max-width:100%; background:#15111F; border-radius:46px; padding:11px;
  box-shadow:var(--shadow); flex:none;
}
.screen{
  height:min(790px, calc(100vh - 168px)); min-height:560px; background:#fff; border-radius:36px;
  overflow:hidden; display:flex; flex-direction:column; position:relative;
}
.appbar{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:16px 18px 12px; border-bottom:1px solid #F1EEF8; flex:none;
}
.wordmark{font-weight:700; color:var(--lilac); font-size:19px; letter-spacing:-.02em}
.quickexit{
  border:1.5px solid var(--lilac); color:var(--lilac); border-radius:11px; padding:7px 11px;
  font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:7px; transition:.16s;
}
.quickexit:hover{background:var(--lilac-soft)}
.appbody{flex:1; overflow-y:auto; padding:16px 18px 20px; scrollbar-width:thin}
.appbody::-webkit-scrollbar{width:6px}
.appbody::-webkit-scrollbar-thumb{background:#DDD7EF;border-radius:99px}
.appfoot{flex:none; border-top:1px solid #F1EEF8; padding:12px 16px; background:#fff}
.footrow{display:flex; gap:8px; align-items:center}
.footrow .send{
  width:46px; height:46px; border-radius:12px; background:var(--lilac); color:#fff; flex:none;
  display:inline-flex; align-items:center; justify-content:center; transition:.16s;
}
.footrow .send:hover{background:var(--lilac-2)}
.chip{
  border:1.5px solid var(--lilac); color:var(--lilac); border-radius:999px; padding:8px 14px;
  font-size:13.5px; font-weight:600; background:#fff; transition:.16s; white-space:nowrap;
}
.chip:hover{background:var(--lilac-soft)}
.chip.solid{background:var(--lilac); color:#fff}
.chip.solid:hover{background:var(--lilac-2)}
.chip.plain{border-color:var(--line); color:var(--ink-2); font-weight:500}
.chip.plain:hover{border-color:var(--lilac); color:var(--lilac)}
.btn-primary{
  width:100%; background:var(--lilac); color:#fff; border-radius:12px; padding:14px;
  font-weight:700; font-size:15px; transition:.16s;
}
.btn-primary:hover{background:var(--lilac-2); transform:translateY(-1px)}
.btn-secondary{
  width:100%; background:#fff; color:var(--lilac); border:1.5px solid var(--lilac); border-radius:12px;
  padding:13px; font-weight:600; font-size:14.5px; transition:.16s;
}
.btn-secondary:hover{background:var(--lilac-soft)}
.stack{display:flex; flex-direction:column; gap:9px}
.row{display:flex; gap:9px; flex-wrap:wrap}
.kicker{font-size:12.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--lilac-2)}
h1.app{font-size:27px; line-height:1.16; margin:6px 0 10px; letter-spacing:-.025em; font-weight:700}
h2.app{font-size:20px; line-height:1.24; margin:0 0 10px; letter-spacing:-.02em}
p.lead{color:var(--ink-2); margin:0 0 16px}
.box{border:1px solid var(--line); border-radius:14px; padding:13px 14px; background:#fff}
.box.lilac{background:var(--lilac-veil); border-color:#E3DAF7}
.box.warn{background:var(--warn-bg); border-color:#F0DCBE}
.box.ok{background:var(--ok-bg); border-color:#CDE7D8}
.box.danger{background:var(--danger-bg); border-color:#F1CFCA}
.box strong{color:var(--ink)}
.note{font-size:12.5px; color:var(--muted); margin:0}
.mini{font-size:12.5px; color:var(--ink-2)}
.divider{height:1px;background:var(--line);margin:16px 0}

/* mode buttons */
.modebtn{
  display:block; width:100%; text-align:left; border:1.5px solid var(--lilac); border-radius:14px;
  padding:13px 14px; background:#fff; transition:.16s;
}
.modebtn:hover{background:var(--lilac-soft); transform:translateY(-1px)}
.modebtn b{display:block; font-size:15.5px; color:var(--lilac)}
.modebtn span{display:block; font-size:12.5px; color:var(--muted); margin-top:2px}
.modebtn.primary{background:var(--lilac); color:#fff}
.modebtn.primary b{color:#fff} .modebtn.primary span{color:rgba(255,255,255,.78)}
.modebtn.primary:hover{background:var(--lilac-2)}

/* emergency */
.emg{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:10px}
.emg a{
  display:flex; align-items:center; justify-content:center; gap:7px; border-radius:11px; padding:12px 8px;
  font-weight:700; font-size:14.5px; text-decoration:none; border:1.5px solid var(--danger); color:var(--danger);
}
.emg a.dark{background:#7A2B22;border-color:#7A2B22;color:#fff}
.emg a:hover{transform:translateY(-1px)}

/* chat */
.msg{margin-bottom:10px; display:flex; flex-direction:column}
.bubble{border-radius:15px; padding:11px 13px; font-size:14.2px; max-width:92%; white-space:pre-line}
.bubble.me{align-self:flex-end; background:var(--lilac); color:#fff; border-bottom-right-radius:5px}
.bubble.bot{align-self:flex-start; background:var(--lilac-veil); border:1px solid #E6DEFA; border-bottom-left-radius:5px}
.bubble.bot.plain{background:#fff; border-color:var(--line)}
.msg .who{font-size:11px; color:var(--muted); margin:0 0 4px 4px}
.msg.me .who{text-align:right; margin-right:4px}
.card-extract{border:1px solid var(--line); border-radius:14px; padding:12px 13px; background:#fff; margin:4px 0 12px}
.kv{display:grid; grid-template-columns:minmax(120px,1fr) 1.5fr auto; gap:8px 10px; font-size:13px; align-items:baseline}
.kvbody{display:flex; flex-direction:column; gap:7px}
.kvrow{display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:7px 0; border-bottom:1px dashed var(--line)}
.kvrow:last-child{border-bottom:0}
.kvrow .k{grid-column:1; font-size:11.8px; color:var(--muted)}
.kvrow .v{grid-column:1 / -1; font-size:13.4px; color:var(--ink)}
.kvrow .pill{grid-column:2; grid-row:1; align-self:center}
.kv .k{color:var(--muted)} .kv .v{color:var(--ink)}
.pill{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; white-space:nowrap}
.pill.relatado{background:var(--ok-bg); color:var(--ok-ink)}
.pill.incerto{background:var(--warn-bg); color:var(--warn-ink)}
.pill.negado{background:#F0EEF6; color:#5B5478}
.pill.nao_perguntado{background:#fff; color:var(--muted); border:1px dashed var(--line)}
.pill.dest{background:var(--lilac); color:#fff}

/* route */
.stop{display:grid; grid-template-columns:26px 1fr; gap:12px}
.rail-line{position:relative}
.rail-line::before{content:""; position:absolute; left:12px; top:6px; bottom:-6px; width:2px; background:var(--line)}
.stop:last-child .rail-line::before{display:none}
.node{
  width:26px;height:26px;border-radius:50%; display:flex;align-items:center;justify-content:center;
  background:#fff; border:2px solid var(--line); color:var(--muted); font-size:11px; font-weight:700; z-index:1;
}
.node.ok{background:var(--ok-bg); border-color:#9CD4B4; color:var(--ok-ink)}
.node.warn{background:var(--warn-bg); border-color:#E6C58E; color:var(--warn-ink)}
.node.dest{background:var(--lilac); border-color:var(--lilac); color:#fff}
.stop-body{padding-bottom:16px}
.stop-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.stop-head b{font-size:15px}
.stop-km{margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted)}
.badge{font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:6px; background:var(--lilac-soft); color:var(--lilac); letter-spacing:.02em}
.badge.ok{background:var(--ok-bg); color:var(--ok-ink)}
.badge.warn{background:var(--warn-bg); color:var(--warn-ink)}
.badge.neutral{background:#F0EEF6; color:#5B5478}
.stop-body p{margin:4px 0 0; font-size:13.2px; color:var(--ink-2)}
.leg{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--muted); margin-top:2px}
.contact{display:flex; gap:11px; align-items:flex-start; padding:10px 0; border-bottom:1px dashed var(--line)}
.contact:last-child{border-bottom:0}
.contact .ic{width:34px;height:34px;border-radius:10px;background:var(--lilac-soft);color:var(--lilac);display:flex;align-items:center;justify-content:center;flex:none}
.contact b{display:block; font-size:14px}
.contact span{font-size:12.3px; color:var(--muted)}
.contact a.num{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--lilac); text-decoration:none; font-weight:700}
.code{
  font-family:'JetBrains Mono',monospace; font-size:30px; letter-spacing:.14em; font-weight:700;
  background:var(--lilac-veil); border:1px solid #E3DAF7; border-radius:14px; padding:16px 10px; text-align:center; color:var(--lilac);
}
/* inspector */
.tabs{display:flex; gap:3px; background:var(--lilac-veil); border-radius:11px; padding:4px; margin-bottom:14px}
.tabs button{flex:1; padding:7px 4px; border-radius:8px; font-size:12.5px; font-weight:600; color:var(--muted); transition:.15s}
.tabs button.on{background:#fff; color:var(--lilac); box-shadow:0 1px 4px rgba(25,20,48,.08)}
pre.json{
  background:#191430; color:#D9D2F5; border-radius:12px; padding:13px; font-family:'JetBrains Mono',monospace;
  font-size:11.4px; line-height:1.6; overflow-x:auto; margin:0; white-space:pre-wrap; word-break:break-word;
}
pre.json .k{color:#9FE0C4} pre.json .s{color:#F6C99A} pre.json .n{color:#B9AEF2} pre.json .b{color:#F29CA8}
.logrow{display:flex; gap:10px; padding:9px 0; border-bottom:1px dashed var(--line); font-size:12.6px}
.logrow:last-child{border-bottom:0}
.logrow .t{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--muted); flex:none; padding-top:2px; width:44px}
.logrow code{font-family:'JetBrains Mono',monospace; font-size:11.4px; color:var(--lilac); background:var(--lilac-veil); padding:1px 5px; border-radius:5px}
.srcitem{padding:10px 0; border-bottom:1px dashed var(--line); font-size:13px}
.srcitem:last-child{border-bottom:0}
.srcitem b{display:block; margin-bottom:2px}
.srcitem a{font-size:11.6px; word-break:break-all; text-decoration:none; color:var(--lilac-2)}
.srcitem a:hover{text-decoration:underline}
.meter{height:8px; border-radius:99px; background:#EFECF7; overflow:hidden; display:flex; margin:10px 0 6px}
.meter i{display:block; height:100%}
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:11.5px; color:var(--muted)}
.apoio-wrap{margin-top:10px; display:flex; flex-direction:column; gap:8px}
.apoio{border:1px solid var(--line); border-left:3px solid var(--lilac-2); border-radius:12px; padding:10px 12px; background:#fff}
.apoio-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.apoio-head b{font-size:13.5px}
.apoio-head .pill{margin-left:auto}
.apoio-list{display:flex; flex-direction:column; gap:9px}
.apoio-row{display:grid; grid-template-columns:10px 1fr; gap:9px; align-items:start}
.apoio-dot{width:10px; height:10px; border-radius:50%; margin-top:5px; background:var(--muted)}
.apoio-dot.ok{background:var(--ok-ink)} .apoio-dot.warn{background:#D79A3A}
.legend span{display:inline-flex; align-items:center; gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.srcline{font-size:13px; color:var(--ink-2); padding:8px 0; border-bottom:1px dashed var(--line)}
.srcline:last-child{border-bottom:0}
.srcline b{color:var(--ink)}
.qbox{border:1px solid var(--line); border-radius:12px; padding:12px 13px; margin-bottom:9px}
.qbox b{display:block; font-size:14px; margin-bottom:4px}
.qbox p{margin:0; font-size:13.2px; color:var(--ink-2)}
.qbox .src{margin-top:7px; font-size:11.5px; color:var(--muted)}
.totem{display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px dashed var(--line)}
.totem:last-child{border-bottom:0}
.totem .ic{width:36px;height:36px;border-radius:11px;background:var(--lilac-soft);color:var(--lilac);display:flex;align-items:center;justify-content:center;flex:none}
.totem b{display:block; font-size:14px}
.totem span{font-size:12.4px; color:var(--muted)}
.stage-cap{font-size:12.5px; color:var(--muted); text-align:center; max-width:420px}
.stage-cap b{color:var(--ink-2)}

/* ---------- modo discreto / camuflagem ---------- */
.appbar.stealth{background:#fff}
.appbar.stealth .wordmark{color:#3A3A46}
.cover-shell{position:absolute; inset:0; background:#fff; display:flex; flex-direction:column; z-index:5}
.cover-bar{display:flex; align-items:center; gap:9px; padding:14px 16px 10px; border-bottom:1px solid #EFEFEF}
.cover-bar b{font-size:16px; color:#2C2C36}
.avatar{width:30px;height:30px;border-radius:50%;background:#E4E7EC;color:#6B7280;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.cover-body{flex:1; overflow-y:auto; padding:12px 14px}
.cover-msg{background:#F2F3F5}
.cover-msg .bubble.bot{background:#fff;border-color:#E6E6EA}
.cover-msg .bubble.me{background:#3B82F6}
.cover-msg .who{color:#8A8A96}
.calc-display{flex:1; background:#fff; display:flex; flex-direction:column; justify-content:flex-end; padding:14px; overflow-y:auto; max-height:46%}
.calc-display .bubble{font-size:11.5px; padding:6px 9px; margin-bottom:5px; border-radius:9px}
.calc-display .msg{margin-bottom:4px}
.calc-display .kvrow{display:none}
.calc-keys{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:#D7D8DC; flex:1}
.calc-keys span{background:#F7F7F8; display:flex; align-items:center; justify-content:center; font-size:17px; color:#1C1C22}
.notes-body{flex:1; padding:16px; overflow-y:auto; font-size:12.5px; color:#3A3A46}
.notes-body .bubble{font-size:11.5px; padding:6px 9px}
.notes-body .msg{margin-bottom:5px}
.sensor-chip{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; background:#F1F3F5; color:#5A5A66}
.sensor-chip.live{background:var(--ok-bg); color:var(--ok-ink)}
.sensor-chip.alert{background:var(--danger-bg); color:var(--danger)}
.toast{position:absolute; left:14px; right:14px; bottom:14px; background:rgba(25,20,48,.93); color:#fff;
  padding:10px 13px; border-radius:11px; font-size:12.5px; z-index:9; box-shadow:0 10px 30px -12px rgba(0,0,0,.6)}
.panicbtn{position:absolute; top:14px; right:14px; z-index:9; background:rgba(25,20,48,.92); color:#fff;
  border-radius:999px; padding:7px 12px; font-size:12px; font-weight:700}
.camo-note{border:1px dashed #D8D3E6; background:#FBFAFE; border-radius:12px; padding:10px 12px; font-size:12.3px; color:var(--ink-2)}
.camo-list{display:flex; flex-direction:column; gap:9px}
.coveropt{display:flex; gap:12px; align-items:flex-start; border:1.5px solid var(--line); border-radius:13px; padding:12px; background:#fff; width:100%; text-align:left; transition:.16s}
.coveropt:hover{border-color:var(--lilac)}
.coveropt.on{border-color:var(--lilac); background:var(--lilac-soft)}
.coveropt b{display:block; font-size:14.5px}
.coveropt span{font-size:12.4px; color:var(--muted)}
.coveropt .mini-ic{width:38px;height:38px;border-radius:11px;background:#F1F3F5;color:#3A3A46;display:flex;align-items:center;justify-content:center;flex:none}
@media (max-width:1240px){
  .shell{grid-template-columns:1fr; padding:18px 16px 46px}
  .rail,.inspector{position:static}
  .navlist{flex-direction:row; overflow-x:auto; padding-bottom:4px}
  .navbtn{white-space:nowrap}
  .screen{height:min(760px, calc(100vh - 120px))}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">

function tagsDe(m){
  const t=[]; if(m.deam) t.push('deam'); if(m.ceam) t.push('ceam'); if(m.sala) t.push('sala'); if(m.abrigo) t.push('abrigo'); return t;
}
function tagLabel(t){
  return {deam:'DEAM', ceam:'CEAM', sala:'Sala Lilás', abrigo:'Abrigo'}[t] || t;
}
function tagClass(t){ return t==='deam'||t==='sala' ? 'ok' : (t==='ceam'||t==='abrigo' ? 'neutral' : 'warn'); }

/* ---------- pontos de apoio (base sintética) ---------- */
const TIPOS_ESPECIALIZADOS = ['deam','sala','abrigo','ceam','cmb','nudem','crei','guarda'];
function pontosDe(cidade){ return (PONTOS[cidade]||[]).slice(); }
function metaTipo(t){ return TIPO_INFO[t] || {nome:t, oferta:'', peso:1}; }
function tipoLabel(t){ return metaTipo(t).nome; }
function toMin(s){ const q=String(s).split(':').map(Number); return q[0]*60+q[1]; }
function abertoAgora(p){
  const h = p.hor || {};
  if(h.h24) return true;
  const now = new Date(), dow = now.getDay();
  const dias = h.dias || '';
  let okDow = false;
  if(dias.indexOf('seg')>=0 && dias.indexOf('sex')>=0) okDow = dow>=1 && dow<=5;
  else if(dias==='qui') okDow = dow===4;
  else if(dias==='ter') okDow = dow===2;
  const hh = now.getHours()*60 + now.getMinutes();
  return okDow && hh>=toMin(h.de||'00:00') && hh<=toMin(h.ate||'23:59');
}
function proximaAbertura(p){
  const h = p.hor || {};
  if(h.h24) return 'plantão 24h';
  const now = new Date(), hh = now.getHours()*60 + now.getMinutes();
  const dia = (h.dias || 'dia útil').toLowerCase();
  if(hh < toMin(h.de||'00:00')) return 'abre às ' + h.de;
  return 'abre ' + dia + ' às ' + h.de;
}
function ordenarPontos(ps){
  return ps.slice().sort((a,b)=>{
    const oa = abertoAgora(a)?1:0, ob = abertoAgora(b)?1:0;
    if(oa!==ob) return ob-oa;
    const pa = metaTipo(a.tipo).peso, pb = metaTipo(b.tipo).peso;
    return pb-pa;
  });
}
function pontoHTML(p){
  const ab = abertoAgora(p), m = metaTipo(p.tipo);
  return `<div class="apoio">
    <div class="apoio-head">
      <span class="badge ${TIPOS_ESPECIALIZADOS.indexOf(p.tipo)>=0?'ok':'neutral'}">${esc(tipoLabel(p.tipo))}</span>
      <b>${esc(p.nome)}</b>
      <span class="pill ${ab?'relatado':'nao_perguntado'}">${ab?'aberto agora':'fechado'}</span>
    </div>
    <div class="mini" style="margin-top:5px"><strong>${esc(p.hor.rotulo || 'horário a confirmar')}</strong>${ab?'':' · '+esc(proximaAbertura(p))}</div>
    <div class="mini" style="margin-top:3px">${esc(p.oferta || m.oferta)}</div>
    <div class="mini" style="margin-top:3px">${esc(p.end)} · <span style="font-family:'JetBrains Mono',monospace">${esc(p.tel || 'telefone não confirmado')}</span></div>
    ${p.faltando && p.faltando.length ? `<div class="mini" style="margin-top:4px;color:var(--warn-ink)">Falta confirmar: ${p.faltando.map(esc).join(' · ')}</div>` : ''}
    ${p.sintetico ? '<div class="mini" style="margin-top:4px;color:var(--muted)">Dados sintéticos — ilustrativos, para a demonstração.</div>' : ''}
  </div>`;
}
function apoioDe(cidade){
  const pts = ordenarPontos(pontosDe(cidade));
  const esp = pts.filter(x => TIPOS_ESPECIALIZADOS.indexOf(x.tipo)>=0);
  const basicos = pts.filter(x => TIPOS_ESPECIALIZADOS.indexOf(x.tipo)<0);
  return {esp, basicos, todos:pts};
}
function resumoApoioHTML(r){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  const linhas = r.pontos.map(p=>{
    const ap = apoioDe(p.c);
    return {c:p.c, km:p.km, esp:ap.esp, abertos:ap.esp.filter(x=>abertoAgora(x))};
  });
  const comRede = linhas.filter(l=>l.esp.length);
  const abertas = linhas.filter(l=>l.abertos.length);
  const detalhes = comRede.map(l=>{
    const st = l.abertos.length
      ? l.abertos.length + ' ponto(s) aberto(s) agora'
      : 'fechado agora — ' + (l.esp[0].hor.h24 ? 'plantão 24h' : proximaAbertura(l.esp[0]));
    return `<div class="apoio-row">
      <span class="apoio-dot ${l.abertos.length?'ok':'warn'}"></span>
      <span><b>${esc(l.c)}</b> <span class="note">· ${l.km===0?'saída':l.km+' km'} · ${esc(st)}</span><br>
      <span class="note">${l.esp.map(x=>esc(tipoLabel(x.tipo))).join(' · ')}</span></span>
    </div>`;
  }).join('');
  return `<div class="box ${abertas.length?'ok':'warn'}" style="margin-top:12px">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <b style="font-size:14px">Onde dá para parar de verdade</b>
      <span class="pill ${abertas.length?'relatado':'incerto'}">agora ${hh}</span>
    </div>
    <p class="mini" style="margin:6px 0 0">${abertas.length
      ? 'Pontos com equipe de acolhimento ao longo do caminho:'
      : 'Nenhum ponto de acolhimento especializado está aberto neste momento no trajeto. O que funciona 24h é a DEAM; para orientação agora, ligue 180.'}</p>
    <div class="apoio-list" style="margin-top:9px">${detalhes || '<span class="mini">Nenhuma cidade do trajeto tem equipe de acolhimento mapeada — é por isso que o caminho importa.</span>'}</div>
    <p class="note" style="margin-top:9px">Horários, endereços e telefones desta tela são <strong>sintéticos</strong> (base de demonstração). O que existe foi levantado pela equipe; o que falta está marcado em cada ponto.</p>
  </div>`;
}

  {k:['piorar','denunciar','retalia','vingar'], html:`Esse medo é real e comum. O rompimento do vínculo pode ser um momento de maior risco — vale planejar a segurança com apoio de profissionais antes de agir.<br><br>Não decido por você e não recomendo ficar nem sair. Denunciar não é o único caminho: dá para pedir orientação <strong>sem registrar nada</strong>.<br><br><span class="note">Fonte: Lei 11.340/2006 e literatura consultada. Ainda sem revisão jurídica nem de assistente social.</span>`},

];

function answerInfo(q){
  const ql = q.toLowerCase();
  for(const a of INFO_ANSWERS){

        const r = S.muni ? (corredorDe(S.muni) || rotaGenerica(S.muni)) : null;
        if(!r) return `Não encontrei sede de DEAM para ${esc(S.muni||'o município informado')} nas minhas fontes.<br><br>Em perigo, o <strong>190</strong> e o <strong>Ligue 180</strong> funcionam de qualquer município: você não precisa se deslocar para pedir ajuda por telefone.`;
        return `A delegacia mais próxima é a de <strong>${esc(r.d)}</strong>, a cerca de <strong>${r.km} km</strong> por estrada (estimativa).<br><br>${r.pontos.filter(p=>!p.tags.length).length ? `No caminho, <strong>${r.pontos.filter(p=>!p.tags.length).map(p=>esc(p.c)).join(', ')}</strong> ${r.pontos.filter(p=>!p.tags.length).length>1?'não têm':'não tem'} rede de apoio.` : 'O trecho tem rede de apoio.'}<br><br>${S.muni && S.muni!==r.o ? 'Você também pode pedir orientação por telefone sem sair de casa.' : ''}<br><br><span class="note">Levantamento da equipe, não oficial. Distâncias estimadas. <button class="chip" data-go="rota" style="margin-top:6px">Ver a rota completa</button></span>`;

}

function screenUnidade(){
  const m = S.muni;
  const dist = uni => {
    if(!m) return null;
    if(m === uni.c) return 0;
    const ds = DIST_SALA[m];
    if(ds && ds[uni.c] !== undefined) return ds[uni.c];
    const mm = byName(m);
    if(mm && mm.dp === uni.c && mm.dr != null) return mm.dr;
    const corr = CORREDORES.find(c => c.o === m && c.pontos.some(p=>p.c===uni.c));
    if(corr) { const p = corr.pontos.find(p=>p.c===uni.c); return p.km; }
    return null;
  };
  const opts = SALA_LILAS.map(u=>{
    const d = dist(u);
    const isNear = d !== null && d === Math.min(...SALA_LILAS.map(dist).filter(v=>v!==null));
    return `<button class="modebtn" data-unit="${esc(u.c)}" ${S.unit===u.c?'style="background:var(--lilac-soft);border-width:2px"':''}>
      <b>${esc(u.uni)} — ${esc(u.c)}</b>
      <span>${esc(u.end)}</span>
      <span style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
        ${d!==null?`<span class="badge ${isNear?'ok':'neutral'}">${isNear?'mais próxima':''} ≈ ${d} km (estimativa)</span>`:'<span class="badge neutral">distância a confirmar</span>'}
        <span class="badge neutral">${esc(u.hor)}</span>
      </span>
    </button>`;
  }).join('');
  return `
  <div class="kicker">Deixar o resumo numa Sala Lilás?</div>
  <h1 class="app">Escolha a unidade.</h1>
  <div class="box ok" style="margin-bottom:14px">
    <div class="row" style="gap:10px"><span class="pill relatado">Vai</span><span class="mini">o resumo que você viu</span></div>
    <div class="row" style="gap:10px;margin-top:5px"><span class="pill nao_perguntado">Não vai</span><span class="mini">nome, telefone nem endereço. Eu não pedi.</span></div>
  </div>
  <div class="stack">${opts}</div>
  ${(()=>{
    if(!S.unit) return '';
    const ap = apoioDe(S.unit);
    if(!ap.esp.length) return '';
    return `<h3 style="font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px">Rede de apoio em ${esc(S.unit)}</h3>
      <div class="apoio-wrap">${ap.esp.slice(0,4).map(pontoHTML).join('')}</div>
      <p class="note" style="margin-top:8px">Horários e contatos deste bloco são sintéticos, exceto os da própria Sala Lilás (aba Fontes).</p>`;
  })()}
  ${(()=>{
    const rg = rotaGenerica(S.muni);
    const semDist = !S.muni || SALA_LILAS.every(u=>dist(u)===null);
    if(!semDist) return '';
    return `<div class="box warn" style="margin-top:14px">
      <b style="font-size:14px">${rg ? 'A Sala Lilás mais próxima está longe.' : 'Não encontrei distância para o seu município.'}</b>
      <p class="mini" style="margin:5px 0 9px">${rg ? `A delegacia mais próxima é a de <strong>${esc(rg.d)}</strong> (≈${rg.km} km). As Salas Lilás ficam em Goiânia, Aparecida e Anápolis — ainda mais longe. <strong>Planeje o deslocamento com apoio antes de sair</strong> e prefira uma cidade com DEAM no caminho.` : 'Consulte a rota do município para saber onde há rede de apoio no caminho.'}</p>
      <button class="chip" data-go="rota">Ver a rota até a delegacia mais próxima</button>
    </div>`;
  })()}
  <div class="box warn" style="margin-top:14px">
    <p class="mini" style="margin:0">Essas unidades ficam em poucas cidades. Você pode deixar o código agora e ir quando puder — o <strong>Ligue 180</strong> orienta por telefone, de qualquer lugar. Endereço, telefone e horário: confirme com a Polícia Científica.</p>
  </div>
  <p class="note" style="margin-top:12px">Simulação: neste protótipo o envio é de demonstração. Num serviço real dependeria de integração com a unidade.</p>
  <div class="stack" style="margin-top:14px">

    <button class="btn-secondary" data-act="naoenviar">Não enviar nada</button>
  </div>`;
}

function setField(id, value, status, msg){
  const def = FIELDS_DEF.find(d=>d.id===id);
  if(!def) return;
  const i = S.fields.findIndex(f=>f.id===id);
  const rec = {id, label:def.label, value, status, msg:msg||'#'+(S.relato.filter(r=>r.who==='me').length||1)};
  if(i>=0) S.fields[i] = rec; else S.fields.push(rec);
}
function botMsg(html, card){ S.relato.push({who:'bot', html, card:card||''}); }
function meMsg(html){ S.relato.push({who:'me', html:esc(html)}); }
function storyBlock(text, adds){
  meMsg(text);
  const n = '#'+S.relato.filter(r=>r.who==='me').length;
  (adds||[]).forEach(a=>setField(a[0], a[1], a[2], n));
}

function startRelato(){
  S.relato = []; S.fields = []; S.step = 0; S.code=null; S.unit=null;
  botMsg('Quer me contar o que está acontecendo, no seu tempo?\n\nPode ser do seu jeito: não precisa ser bonito nem completo. Eu organizo depois.');
  log('sessao.iniciar', 'modo=organizar_relato · consentimento aceito', 'tool');
  render();
}

function answerRelato(text, quick){
  const step = STEPS[S.step];
  if(!step) return;
  const q = (quick||text||'').trim();
  if(!q) return;
  meMsg(q);
  const isIntro = step.kind==='intro';
  const isPrefere = /prefiro não responder|prefiro nao responder/i.test(q);
  const isNS = /não sei|nao sei|não lembro/i.test(q);
  const isNo = /^(não|nao)\b/i.test(q) && !isNS;
  const isSim = /^(sim|já|sim,)/i.test(q);

  if(isPrefere){
    setField(step.field, 'não respondeu', 'nao_perguntado', '#'+S.relato.filter(r=>r.who==='me').length);
    botMsg('Tudo bem. Deixo como <strong>não perguntado</strong> — isso não significa que não existe.');
  } else if(isNS){
    setField(step.field, 'não sabe', 'incerto', '#'+S.relato.filter(r=>r.who==='me').length);
    botMsg('Registrei como <strong>incerto</strong>. “Não sei” não vira “não”, e também não aumenta a prioridade por causa disso.');
  } else if(isIntro){
    // extração simulada do primeiro relato
    setField('relacao', 'ex-companheiro', 'relatado', '#2');
    setField('ameaca', '“Disse que vai me procurar”', 'relatado', '#2');
    setField('perseguicao', '“liga várias vezes por dia desde março”', 'relatado', '#2');
    setField('episodio', 'semana passada (aproximado)', 'incerto', '#2');
    setField('local', '“na porta do meu trabalho”', 'relatado', '#2');
    log('extrair_campos', 'msg #2 → 5 campos (3 relatados, 1 incerto)', 'tool');
    botMsg('Obrigada por contar. Sinto muito que você esteja passando por isso.',
      `<div class="card-extract">
        <div class="kicker" style="margin-bottom:8px">Anotei</div>
        <div class="kvbody">
          <div class="kvrow"><span class="k">Relação</span><span class="pill relatado">relatado</span><span class="v">ex-companheiro</span></div>
          <div class="kvrow"><span class="k">Ameaça</span><span class="pill relatado">relatado</span><span class="v">“Disse que vai me procurar”</span></div>
          <div class="kvrow"><span class="k">Último episódio</span><span class="pill incerto">incerto</span><span class="v">semana passada (aproximado)</span></div>
        </div>
        <p class="note" style="margin-top:8px">Se algo estiver errado, pode me corrigir.</p>
      </div>`);
    S.step++;
    log('pergunta.seguinte', 'lacuna: ameaça adicional, agressão física, arma, medida protetiva, filhos, local', 'agent');
    render();
    return;
  } else {
    // pergunta seguinte
    const val = isNo ? 'não' : (isSim ? 'relatado' : q);
    const st = isNo ? 'negado' : 'relatado';
    setField(step.field, val, st, '#'+S.relato.filter(r=>r.who==='me').length);
    botMsg(isNo ? 'Registrei como <strong>negado</strong> por você.' : 'Anotado.');
    log('extrair_campos', `msg #${S.relato.filter(r=>r.who==='me').length} → ${step.field} = ${STATUS[st]}`, 'tool');
  }
  S.step++;
  if(S.step >= STEPS.length){
    botMsg('É isso que eu entendi. Você pode conferir antes de decidir o que fazer.');
    log('resumo.gerar', `${S.fields.filter(f=>f.status==='relatado').length} campos relatados · ${S.fields.filter(f=>f.status==='incerto').length} incertos · ${FIELDS_DEF.length - S.fields.length} não perguntados`, 'agent');
  }
  render();
}

function gerarCodigo(){
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0;i<5;i++) s += abc[Math.floor(Math.random()*abc.length)];
  return 'SL-' + s;
}
function confirmarEnvio(){
  if(!S.unit){ S.pending='unidade'; render(); return; }
  const code = gerarCodigo();
  S.code = code;
  log('sala_lilas.deixar', `unidade=${S.unit} · código=${code} (simulação)`, 'tool');
  log('revisao.humana', 'resumo entregue para revisão profissional — nenhuma decisão automática', 'agent');
  go('codigo');
}

function ocultarAgora(motivo, apagar){
  if(S.rota==='minimizado') return;
  if(apagar || S.stealth.autoWipe){
    S.relato=[]; S.fields=[]; S.step=0; S.code=null; S.unit=null; S.chatInfo=[];
    log('sessao.apagar','sessão apagada por acionamento discreto','tool');
  }
  S.rota = 'minimizado';
  S.stealth.sensor.detected = false;
  toast(motivo==='sensor'
    ? 'O aparelho parece ter mudado de mãos. A tela voltou ao normal e a conversa ficou pausada.'
    : 'Tela mascarada. A conversa fica pausada até você tocar 2x no nome.');
  render();
}
function initSensor(){
  if(!window || typeof window.addEventListener!=='function') return;
  window.addEventListener('deviceorientation', ev=>{
    const st = S.stealth, now = Date.now();
    if(!st.sensor.enabled) return;
    st.sensor.samples.push({t:now, b:ev.beta||0, g:ev.gamma||0});
    st.sensor.samples = st.sensor.samples.filter(s=>now-s.t<2000);
    let energy = 0;
    for(let i=1;i<st.sensor.samples.length;i++){
      energy += Math.abs(st.sensor.samples[i].b-st.sensor.samples[i-1].b)
              + Math.abs(st.sensor.samples[i].g-st.sensor.samples[i-1].g);
    }
    if(st.sensor.samples.length>=10 && energy>70 && now-st.sensor.last>5000){
      st.sensor.last = now; st.sensor.detected = true;
      log('sensor.movimento','padrão de manuseio alterado — sinal local, não identifica pessoas','tool');
      if(st.autoHide) ocultarAgora('sensor');
      render();
    }
  });
}

document.addEventListener('click', e=>{
  const goBtn = e.target.closest('[data-go]');
  const act = e.target.closest('[data-act]');
  const q = e.target.closest('[data-q]');
  const a = e.target.closest('[data-a]');
  const unit = e.target.closest('[data-unit]');
  const scn = e.target.closest('[data-scn]');
  const tab = e.target.closest('[data-tab]');
  const send = e.target.closest('[data-send]');
  const cap = e.target.closest('[data-cap]');

  if(cap){ S.stealth.cover = cap.dataset.cap; log('fachada.trocar','fachada='+S.stealth.cover,'tool'); render(); return; }
  if(send){
    if(send.dataset.send==='relato'){ const i=document.getElementById('relatoInput'); answerRelato(i?i.value:'', null); }
    if(send.dataset.send==='chat'){ const i=document.getElementById('chatInput'); askInfo(i?i.value:''); }
    return;
  }
  if(tab){ S.tab = tab.dataset.tab; S.pitch=false; document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b===tab)); render(); return; }
  if(scn){ scenario(scn.dataset.scn); return; }
  if(unit){ S.unit = unit.dataset.unit; log('sala_lilas.selecionar', 'unidade='+S.unit, 'tool'); render(); return; }
  if(q){ S.chatInfo.push({who:'me', html:esc(q.dataset.q)}); S.chatInfo.push({who:'bot', html:answerInfo(q.dataset.q)}); log('rag.responder', 'consulta: "'+q.dataset.q+'" → resposta com fonte', 'tool'); render(); return; }
  if(a){ answerRelato(null, a.dataset.a); return; }
  if(goBtn){ go(goBtn.dataset.go); return; }
  if(act){
    const k = act.dataset.act;
    if(k==='quickexit'||k==='encerrar'||k==='reset'){
      if(k==='reset' || confirm('Encerrar e apagar a sessão? O resumo que já foi enviado continua na unidade, sob o código.')){
        S.relato=[]; S.fields=[]; S.step=0; S.code=null; S.unit=null; S.chatInfo=[]; S.log=[];
        log('sessao.encerrar', 'sessão apagada — nada persistido', 'tool');
        go('modo');
      }
      return;
    }
    if(k==='confirmar'){ confirmarEnvio(); return; }
    if(k==='naoenviar'){ log('sala_lilas.recusar', 'a usuária decidiu não enviar o resumo', 'tool'); go('modo'); return; }
    if(k==='copiar'){
      const b = act; const txt = S.code||'';
      (navigator.clipboard? navigator.clipboard.writeText(txt) : Promise.reject()).then(
        ()=>{ b.textContent='Código copiado'; setTimeout(()=>{b.textContent='Copiar o código'; render();},1400); },
        ()=>{ b.textContent='Anote: '+txt; setTimeout(()=>render(),1400); });
      return;
    }
    if(k==='relatorio'){ S.tab='dados'; document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab==='dados')); render(); return; }
    if(k==='abrir-fachada'){ go('fachada'); return; }
    if(k==='stealth-ligar'){
      S.stealth.on = !S.stealth.on;
      log('modo_discreto', S.stealth.on ? 'fachada='+S.stealth.cover+' · nome='+S.stealth.contact : 'desligado', 'tool');
      toast(S.stealth.on ? 'Modo discreto ligado. A tela agora parece outra coisa.' : 'Modo discreto desligado.');
      go('modo');
      return;
    }
    if(k==='orelha'){ S.stealth.orelha = !S.stealth.orelha; render(); return; }
    if(k==='simular-movimento'){
      S.stealth.sensor.detected = true;
      log('sensor.movimento','simulação de manuseio alterado','tool');
      ocultarAgora('sensor');
      return;
    }
    if(k==='apagar-tudo'){
      S.relato=[]; S.fields=[]; S.step=0; S.code=null; S.unit=null; S.chatInfo=[]; S.log=[];
      log('sessao.apagar','sessão apagada a pedido da usuária','tool');
      if(S.stealth.on){ ocultarAgora('manual', true); } else { go('modo'); }
      return;
    }
    if(k==='sensor-toggle'){
      const st = S.stealth.sensor;
      st.enabled = !st.enabled;
      if(st.enabled){
        st.permission = 'solicitada';
        const DOE = window.DeviceOrientationEvent;
        if(DOE && typeof DOE.requestPermission==='function'){
          DOE.requestPermission().then(r=>{ st.permission = r; render(); }).catch(()=>{ st.permission='negada'; render(); });
        } else {
          st.permission = 'não precisa (navegador de desktop)';
        }
        log('sensor.ligar','sensor de movimento ativado — nada é gravado','tool');
      }
      render();
      return;
    }
    if(k==='panico'){ ocultarAgora('manual'); return; }
    if(k==='pitch'){ S.pitch=true; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
    if(k==='fechar-pitch'){ S.pitch=false; render(); return; }
  }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.id==='relatoInput'){ e.preventDefault(); answerRelato(e.target.value, null); }
  if(e.key==='Enter' && e.target.id==='chatInput'){ e.preventDefault(); askInfo(e.target.value); }
});
document.addEventListener('input', e=>{
  if(e.target.id==='muniTop'){ S.muni = e.target.value; log('contexto.municipio', S.muni||'(não informado)', 'tool'); render(); }
  if(e.target.id==='contatoInput'){ S.stealth.contact = (e.target.value||'Marina').slice(0,18); }
});
document.addEventListener('change', e=>{
  if(e.target.id==='muniApp' || e.target.id==='muniRota'){ S.muni = e.target.value; log('contexto.municipio', S.muni||'(não informado)', 'tool'); render(); }
  if(e.target.id==='contatoInput'){ render(); }
});
document.addEventListener('dblclick', e=>{
  if(e.target.closest('.cover-bar') && S.rota==='minimizado'){
    S.rota='modo'; toast('De volta.'); render();
  }
});
function askInfo(text){
  const t = (text||'').trim(); if(!t) return;
  S.chatInfo.push({who:'me', html:esc(t)});
  S.chatInfo.push({who:'bot', html:answerInfo(t)});
  log('rag.responder', 'consulta livre → resposta com fonte', 'tool');
  render();
}

/* ---------- cenários ---------- */
function scenario(k){
  if(k==='joana'){
    S.muni='Trindade'; S.mode='relato'; S.relato=[]; S.fields=[]; S.step=0; S.code=null; S.unit=null; S.chatInfo=[];
    document.getElementById('muniTop').innerHTML = muniOptions(S.muni);
    botMsg('Quer me contar o que está acontecendo, no seu tempo?\n\nPode ser do seu jeito: não precisa ser bonito nem completo. Eu organizo depois.');
    log('sessao.iniciar', 'modo=organizar_relato · consentimento aceito', 'tool');
    const bl1 = 'Faz uns dois anos que a gente mora junto, eu e o Rogério. No começo era carinhoso, mas aos poucos foi mudando. Primeiro foi o ciúme: ele não gostava que eu falasse com minhas amigas, começou a conferir meu celular todo dia e ligava várias vezes por dia. Eu fui me afastando de todo mundo porque era mais fácil do que brigar. Ele controla o dinheiro: pega meu cartão e só me dá o dinheiro do ônibus. Quando pedi para ter uma conta só minha, ele riu e disse que eu ia me arrepender.';
    const bl2 = 'As coisas pioraram depois que eu falei em terminar, mais ou menos em agosto. Ele disse que se eu fosse embora ia me procurar onde eu estivesse e que eu não ia ficar com as crianças. Eu tenho dois filhos, um de 6 e um de 9 anos, são dele também. Na semana passada ele me empurrou contra a parede da cozinha e apertou meu braço com força, ficou roxo. As crianças estavam na sala e ouviram tudo, a menor chorou. Depois ele quebrou meu celular e disse que foi sem querer, mas eu vi que não foi. Foi só essa vez que ele encostou em mim, mas acho que antes já teve outras, um tapa uma vez, ou duas, não lembro direito.';
    const bl3 = 'Ontem ele apareceu na porta do meu trabalho. Disse que só queria conversar, mas ficou me seguindo até o ponto de ônibus. Todo mundo da loja viu. Ele disse que se eu contasse para alguém ia piorar. Eu não sei se ele tem arma em casa, nunca vi, mas ele tem amigos que andam armados e vive falando disso. Nunca fiz boletim, não sei se tenho medida protetiva, nem sei como pedir. Eu moro em Trindade. Eu nem sei se isso é violência, porque ele nunca me bateu de verdade. O que eu faço?';
    setTimeout(()=>{
      storyBlock(bl1, [
        ['relacao','ex-companheiro (2 anos de convivência)','relatado'],
        ['perseguicao','“confere meu celular todo dia”, “liga várias vezes por dia”','relatado']
      ]);
      log('extrair_campos','msg #2 → relação e vigilância (relatados)','tool');
    }, 380);
    setTimeout(()=>botMsg('Obrigada por contar. Sinto muito que você esteja passando por isso.'), 700);
    setTimeout(()=>{
      storyBlock(bl2, [
        ['ameaca','“ia me procurar onde eu estivesse”','relatado'],
        ['fisico','empurrão e braço apertado; também “foi só essa vez” × “já teve outras”','relatado'],
        ['filhos','filhos de 6 e 9 anos presentes e ouviram','relatado'],
        ['episodio','semana passada (aproximado)','incerto']
      ]);
      log('extrair_campos','msg #3 → ameaça, agressão física, filhos, episódio','tool');
    }, 1050);
    setTimeout(()=>botMsg('Anotei. As duas versões do episódio ficam guardadas, do jeito que você contou.'), 1400);
    setTimeout(()=>{
      storyBlock(bl3, [
        ['local','“na porta do meu trabalho”','relatado'],
        ['episodio','ontem (aproximado)','incerto'],
        ['arma','“não sei se ele tem arma… nunca vi”','incerto'],
        ['medida','“não sei se tenho medida protetiva”','incerto']
      ]);
      log('extrair_campos','msg #4 → local, episódio, arma e medida (incertos)','tool');
    }, 1750);
    setTimeout(()=>{
      botMsg('É isso que eu entendi. Você pode conferir antes de decidir o que fazer.');
      S.step = STEPS.length;
      log('resumo.gerar','5 campos relatados · 4 incertos · 0 não perguntados','agent');
      render();
    }, 2150);
    go('conversa');
  }
  if(k==='campos'){
    S.muni='Campos Belos';
    document.getElementById('muniTop').innerHTML = muniOptions(S.muni);
    go('rota');
  }
  if(k==='rota'){
    S.muni='Trindade';
    document.getElementById('muniTop').innerHTML = muniOptions(S.muni);
    go('rota');
  }
  if(k==='painel'){
    S.muni='Trindade';
    document.getElementById('muniTop').innerHTML = muniOptions(S.muni);
    S.fields=[      {id:'relacao',label:'Relação com a pessoa agressora',value:'ex-companheiro',status:'relatado',msg:'#2'},
      {id:'ameaca',label:'Ameaça',value:'“Disse que vai me procurar”',status:'relatado',msg:'#2'},
      {id:'perseguicao',label:'Perseguição ou vigilância',value:'“liga várias vezes por dia desde março”',status:'relatado',msg:'#2'},
      {id:'episodio',label:'Episódio mais recente',value:'ontem (aproximado)',status:'incerto',msg:'#2'},
      {id:'local',label:'Local do último episódio',value:'“na porta do meu trabalho”',status:'relatado',msg:'#2'},
      {id:'arma',label:'Acesso a arma',value:'“não sei”',status:'incerto',msg:'#8'},
      {id:'fisico',label:'Agressão física',value:'empurrão e braço apertado',status:'relatado',msg:'#3'},
      {id:'medida',label:'Medida protetiva',value:'não sabe',status:'incerto',msg:'#9'},
      {id:'filhos',label:'Filhos testemunharam',value:'filhos de 6 e 9 anos presentes',status:'relatado',msg:'#3'}
    ];
    S.unit='Anápolis'; S.code='SL-X937XD';
    go('painel');
  }
  if(k==='olhada'){
    S.muni='Trindade';
    document.getElementById('muniTop').innerHTML = muniOptions(S.muni);
    S.stealth.on = true;
    S.stealth.cover = 'mensagens';
    S.stealth.contact = 'Marina';
    S.stealth.sensor.enabled = true;
    S.stealth.sensor.permission = 'demonstração';
    log('modo_discreto','fachada=mensagens · nome=Marina · sensor ligado','tool');
    go('rota');
    toast('Modo discreto ligado: a tela parece uma conversa com a Marina.');
  }
}

/* ---------- boot ---------- */
document.getElementById('muniTop').innerHTML = muniOptions('');
initSensor();
render();
</script>
